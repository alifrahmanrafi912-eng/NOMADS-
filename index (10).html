<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOMADS — The World Within Your Reach</title>
<meta name="description" content="NOMADS: a proposed premium camper-hospitality concept in Bangladesh, with a fully working DEMO booking system. Academic business concept.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Hind+Siliguri:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#151A18;--forest:#293D34;--ivory:#F6F3EC;--red:#C73832;--gold:#C6A978;--d:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--b:"Inter","Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;--pad:clamp(18px,5vw,72px)}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:80px}
body{font:16px/1.6 var(--b);background:var(--ivory);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}a{color:inherit}
h1,h2,h3{font-family:var(--d);text-transform:uppercase;line-height:1;font-weight:700;text-wrap:balance}
h1{font-size:clamp(2.6rem,8vw,6.2rem)}h2{font-size:clamp(2rem,5vw,3.6rem)}h3{font-size:1.4rem}
.wrap{max-width:1300px;margin:auto;padding:0 var(--pad)}section{padding:clamp(52px,8vw,108px) 0}
.dk{background:var(--ink);color:var(--ivory)}.fo{background:var(--forest);color:var(--ivory)}.wh{background:#fff}
.ey{display:block;font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--red);margin-bottom:12px}.dk .ey,.fo .ey,.hero .ey{color:var(--gold)}
.lead{max-width:62ch;opacity:.85;margin-top:16px}p+p{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 24px;border-radius:2px;font:600 .88rem var(--b);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;border:1.5px solid transparent;cursor:pointer;background:none;color:inherit}
.red{background:var(--red);color:#fff}.red:hover{background:#a92c27}.line{border-color:currentColor}.line:hover{background:rgba(127,127,127,.15)}.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px;z-index:99}.skip:focus{left:8px}
header{position:fixed;inset:0 0 auto;height:64px;z-index:50;background:var(--ink);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.1)}
header .wrap{height:100%;display:flex;align-items:center;gap:14px}
.logo{font:700 1.6rem var(--d);letter-spacing:.14em;text-decoration:none;margin-right:auto}.logo i{color:var(--red);font-style:normal}
nav ul{list-style:none;padding:0;display:flex;gap:22px}nav a{text-decoration:none;font-size:.75rem;letter-spacing:.13em;text-transform:uppercase;opacity:.8}nav a:hover,nav a[aria-current]{opacity:1;color:var(--gold)}
.bk{min-height:42px;padding:8px 18px}.burger{display:none;width:44px;height:44px;background:none;border:0;color:#fff;font-size:1.7rem;cursor:pointer}
@media(max-width:1000px){.burger{display:block}nav{position:fixed;inset:64px 0 auto;background:var(--ink);display:none;max-height:calc(100svh - 64px);overflow:auto}nav.open{display:block}nav ul{flex-direction:column;gap:0;padding:6px var(--pad) 24px}nav a{display:block;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:.9rem}}
main{min-height:70vh;animation:fi .5s}@keyframes fi{from{opacity:.01}to{opacity:1}}
.hero{position:relative;isolation:isolate;background:var(--ink);color:#fff;padding:calc(64px + 7vh) 0 36px;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;gap:32px}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;z-index:-2}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(21,26,24,.88),rgba(21,26,24,.35) 70%),linear-gradient(0deg,rgba(21,26,24,.8),transparent 50%)}
.hero h1{max-width:11ch}.hero .sub{color:var(--gold);font-weight:600;margin-bottom:12px}.hero p.hd{max-width:46ch;margin:18px 0 24px;opacity:.9}.cta{display:flex;flex-wrap:wrap;gap:12px}
.sf{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr auto;gap:10px;background:var(--ivory);color:var(--ink);padding:14px;border-radius:4px;align-items:end}
@media(max-width:900px){.sf{grid-template-columns:1fr 1fr}}@media(max-width:520px){.sf{grid-template-columns:1fr}}
label,.lb{display:block;font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid rgba(21,26,24,.25);border-radius:3px;background:#fff;color:var(--ink);font:inherit}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}textarea{min-height:90px}[aria-invalid=true]{border-color:var(--red)}
.er{display:block;min-height:1.3em;color:var(--red);font-size:.85rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,90px);align-items:center}.ph{border-radius:4px;overflow:hidden;aspect-ratio:4/3;background:#222}.ph img{width:100%;height:100%;object-fit:cover}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:36px}
@media(max-width:820px){.g3,.g2{grid-template-columns:1fr}}
.card{background:#fff;padding:clamp(20px,3vw,32px);border-radius:4px;border:1px solid rgba(21,26,24,.1)}.dk .card,.fo .card{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.15)}.card p{font-size:.95rem;opacity:.85;margin-top:8px}
.tag{display:inline-block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:2px 8px;border:1px solid var(--gold);color:var(--gold);border-radius:20px;margin-bottom:10px}
.dc{position:relative;border-radius:4px;overflow:hidden;min-height:420px;display:flex;align-items:flex-end;color:#fff;isolation:isolate}.dc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.dc:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(10,14,12,.92),rgba(10,14,12,.1) 70%)}.dc div{padding:28px}.dc p{margin:8px 0 16px;max-width:42ch}
.ph0{padding-top:calc(64px + 48px)}
details{border-bottom:1px solid rgba(21,26,24,.15);max-width:820px}summary{cursor:pointer;padding:18px 0;font-weight:600;list-style:none;min-height:56px}summary:after{content:"+";float:right;color:var(--red);font-size:1.5rem;line-height:1}details[open] summary:after{content:"–"}details p{padding-bottom:18px;opacity:.85}
.tabs{display:inline-flex;gap:4px;padding:4px;border:1px solid rgba(246,243,236,.3);border-radius:4px;margin:20px 0}.tabs button{min-height:42px;padding:6px 22px;border:0;background:none;color:inherit;font:600 .8rem var(--b);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}.tabs [aria-selected=true]{background:var(--ivory);color:var(--ink)}
.stage{display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:4px;overflow:hidden;cursor:zoom-in;background:#222}.stage img{width:100%;height:100%;object-fit:cover}
.sp{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin-bottom:28px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase}.sp li{padding:6px 12px;border-radius:20px;border:1px solid rgba(21,26,24,.25);opacity:.6}.sp .on{background:var(--forest);color:#fff;opacity:1;border-color:var(--forest)}
.bg{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:start}@media(max-width:900px){.bg{grid-template-columns:1fr}}
.ch{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}.ch button{width:44px;height:44px;border:1px solid rgba(21,26,24,.25);background:#fff;border-radius:3px;font-size:1.3rem;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:460px}.cg i{font-style:normal;text-align:center;font-size:.72rem;opacity:.6}.cg button{aspect-ratio:1;min-height:40px;border:0;background:#fff;border-radius:3px;cursor:pointer;font:500 .9rem var(--b);color:var(--ink)}
.cg button:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}.cg .rg{background:#dfe6e0}.cg .se{background:var(--forest);color:#fff}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 18px}.opts label{display:flex;gap:8px;align-items:center;padding:12px 16px;border:1.5px solid rgba(21,26,24,.25);border-radius:3px;margin:0;text-transform:none;letter-spacing:0;font-size:.95rem;cursor:pointer;background:#fff}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:14px 0;font-size:.93rem}.dl dt{opacity:.6}.dl dd{text-align:right;overflow-wrap:anywhere}
.tot{font:700 2.8rem var(--d);color:var(--red);line-height:1}.demo{background:var(--gold);color:var(--ink);padding:8px 12px;font-size:.78rem;font-weight:600;letter-spacing:.04em;border-radius:3px;margin-bottom:14px}
.bd{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.75rem;font-weight:600;text-transform:uppercase;background:#ddd}.bd.confirmed{background:#cfe5d6}.bd.pending{background:#f3e3b5}.bd.cancelled{background:#f2c9c6}
.tl{padding-left:1.2em;font-size:.9rem;margin-top:8px}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}th,td{padding:10px 8px;border-bottom:1px solid rgba(21,26,24,.15);text-align:left}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}.kp b{display:block;font:700 2.2rem var(--d)}
dialog{border:0;border-radius:6px;padding:24px;width:min(560px,calc(100vw - 28px));max-height:calc(100dvh - 28px);background:var(--ivory);color:var(--ink);margin:auto}dialog::backdrop{background:rgba(10,14,12,.75)}dialog.lbx{width:min(1100px,96vw);background:#000;padding:8px}dialog.lbx img{width:100%;max-height:82vh;object-fit:contain}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}footer{background:var(--ink);color:rgba(246,243,236,.8);padding:44px 0 28px;font-size:.88rem}footer ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px 22px;margin:14px 0}footer a{text-decoration:none}footer small{display:block;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,footer,.np,.skip{display:none!important}body{background:#fff}section,.wh{padding:0;background:#fff}.card{border:0}}
